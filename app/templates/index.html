<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image+Audio to Video</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input[type="file"] { margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0051b3; }
        #result { margin-top: 20px; }
        a { color: #0070f3; }
    </style>
</head>
<body>
    <h1>Create a Video from an Image and Audio</h1>
    <form id="uploadForm" enctype="multipart/form-data">
        <label>Image (JPEG/PNG):</label>
        <input type="file" name="image" accept="image/*" required>

        <label>Audio (MP3/WAV, etc.):</label>
        <input type="file" name="audio" accept="audio/*" required>

        <button type="submit">Create Video</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Processing...';

            try {
                const response = await fetch('/create-video', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output.mp4';
                a.textContent = 'Download Video';
                resultDiv.innerHTML = '';
                resultDiv.appendChild(a);
            } catch (err) {
                resultDiv.innerHTML = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
